name: Fix Long Filenames
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete files with long names via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: KARUN-499/karun-portfolio
        run: |
          BRANCH_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/$REPO/git/refs/heads/main \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['object']['sha'])")
          echo "Branch: $BRANCH_SHA"
          TREE_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/$REPO/git/commits/$BRANCH_SHA \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['tree']['sha'])")
          echo "Tree: $TREE_SHA"
          TREE_JSON=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/$REPO/git/trees/$TREE_SHA)
          echo "$TREE_JSON" | python3 -c "import sys,json;[print(i['path']) for i in json.load(sys.stdin)['tree'] if len(i['path'])>50]"
          NEW_TREE=$(echo "$TREE_JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);t=[{'path':i['path'],'mode':i['mode'],'type':i['type'],'sha':i['sha']} for i in d['tree'] if len(i['path'])<=100];print(json.dumps(t))")
          NEW_TREE_SHA=$(curl -sf -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tree\":$NEW_TREE}" \
            https://api.github.com/repos/$REPO/git/trees \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          echo "New tree: $NEW_TREE_SHA"
          NEW_COMMIT=$(curl -sf -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"Remove files with long names\",\"tree\":\"$NEW_TREE_SHA\",\"parents\":[\"$BRANCH_SHA\"]}" \
            https://api.github.com/repos/$REPO/git/commits \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['sha'])")
          echo "New commit: $NEW_COMMIT"
          curl -sf -X PATCH -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$NEW_COMMIT\"}" \
            https://api.github.com/repos/$REPO/git/refs/heads/main
          echo "Done!"
